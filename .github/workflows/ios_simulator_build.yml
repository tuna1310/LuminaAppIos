name: iOS Build & Package IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build Simulator & Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode.app/Contents/Developer" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.4.app/Contents/Developer" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version
          xcodebuild -list -project Lumina.xcodeproj

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Lumina.xcodeproj \
            -scheme Lumina \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build_sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Archive Release Device App (Unsigned arm64)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Lumina.xcodeproj \
            -scheme Lumina \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build_archive/Lumina.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""

      - name: Package & Ad-Hoc Sign Unsigned IPA
        run: |
          APP_PATH="build_archive/Lumina.xcarchive/Products/Applications/Lumina.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Lumina.app not found at $APP_PATH"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Lumina.app
          codesign --force --deep --sign - --timestamp=none Payload/Lumina.app || true
          zip -qry Lumina-unsigned.ipa Payload
          ls -lh Lumina-unsigned.ipa

      - name: Upload Lumina Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-unsigned-IPA
          path: Lumina-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
